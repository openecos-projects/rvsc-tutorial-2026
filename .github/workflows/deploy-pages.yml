name: Deploy slides to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "slides/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; queue new runs instead of cancelling them.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build slides
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: slides/pnpm-lock.yaml

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        working-directory: slides
        run: pnpm install --frozen-lockfile

      - name: Build slides
        working-directory: slides
        env:
          # Project sites live under /<repo>/; custom domains get "/".
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm exec slidev build --without-notes --base "${BASE_PATH%/}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: slides/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
